name: Build and Publish Jacksoon

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io


jobs:
  build-and-push:
    name: Build ${{ matrix.image }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - module: jacksoon-console
            image: console

          - module: jacksoon-filterManagement
            image: filter-management

          - module: jacksoon-registry
            image: registry

          - module: jacksoon-router
            image: router


    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/jacksoon-${{ matrix.image }}

          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .

          file: deploy/Dockerfile

          build-args: |
            MODULE=${{ matrix.module }}

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: |
            type=gha,scope=${{ matrix.image }}

          cache-to: |
            type=gha,mode=max,scope=${{ matrix.image }}


  publish-compose:
    name: Publish Jacksoon Compose

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    permissions:
      contents: read
      packages: write


    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Check Docker Compose version
        run: |
          docker compose version


      - name: Prepare release variables
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "OWNER=$OWNER"
          echo "TAG=$TAG"


      - name: Publish Compose OCI artifact
        shell: bash

        env:
          GHCR_OWNER: ${{ steps.vars.outputs.owner }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}

        run: |
          docker compose \
          -f deploy/compose.yml \
          publish \
          -y \
          --resolve-image-digests \
          "ghcr.io/${GHCR_OWNER}/jacksoon:${IMAGE_TAG}"