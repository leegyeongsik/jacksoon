<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacksoon Console | Register Filter</title>
    <link rel="stylesheet" th:href="@{/css/console.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">J</span>
            <span>
                <strong>Jacksoon</strong>
                <small>Router Console</small>
            </span>
        </a>

        <nav class="nav-menu">
            <a class="nav-item" th:href="@{/}">
                <span>▦</span>
                서비스 관리
            </a>
            <a class="nav-item active" th:href="@{/filter}">
                <span>⚙</span>
                필터 관리
            </a>
        </nav>
    </aside>

    <main class="main-content register-content">
        <header class="page-header register-header">
            <div>
                <p class="eyebrow">REGISTER FILTER</p>
                <h1>필터 등록</h1>
                <p class="page-description">컴파일된 Java 필터 클래스 파일을 Console에 등록합니다.</p>
            </div>

            <a class="secondary-link-button" th:href="@{/filter}">← 필터 목록</a>
        </header>

        <div class="flash-message error-flash"
             th:if="${uploadError}"
             th:text="${uploadError}">
            업로드에 실패했습니다.
        </div>

        <section class="register-card">
            <div class="upload-copy register-copy">
                <p class="section-kicker">CLASS UPLOAD</p>
                <h2>.class 파일 업로드</h2>
                <p>
                    필터 이름과 실행 스테이지, 순서를 지정한 뒤 컴파일된
                    <code>.class</code> 파일을 선택하세요.
                </p>
            </div>

            <form class="upload-form register-form"
                  th:action="@{/filter/upload}"
                  method="post"
                  enctype="multipart/form-data">
                <label class="form-field">
                    <span>필터 이름</span>
                    <input type="text"
                           name="filterName"
                           placeholder="예: AuthenticationFilter"
                           autocomplete="off"
                           required>
                </label>

                <label class="form-field">
                    <span>파이프라인</span>
                    <select name="pipeline" required>
                        <option value="" selected disabled>파이프라인 선택</option>
                        <option th:each="pipeline : ${pipelines}"
                                th:value="${pipeline}"
                                th:text="${pipeline}">ROUTING</option>
                    </select>
                </label>

                <label class="form-field">
                    <span>실행 타이밍</span>
                    <select name="timing" required>
                        <option value="" selected disabled>타이밍 선택</option>
                        <option th:each="timing : ${timings}"
                                th:value="${timing}"
                                th:text="${timing}">PRE</option>
                    </select>
                </label>

                <label class="form-field">
                    <span>실행 순서</span>
                    <input type="number"
                           name="order"
                           min="0"
                           value="0"
                           required>
                    <small class="field-help">숫자가 작을수록 먼저 실행됩니다.</small>
                </label>

                <label class="file-drop-zone" for="classFile">
                    <input type="file"
                           id="classFile"
                           name="classFile"
                           accept=".class,application/java-vm"
                           required>
                    <span class="file-icon">⇧</span>
                    <strong>.class 파일 선택</strong>
                    <small id="selectedFileName">클릭하여 컴파일된 필터 클래스 파일을 선택하세요.</small>
                </label>

                <div class="form-actions">
                    <a class="secondary-link-button" th:href="@{/filter}">취소</a>
                    <button type="submit" class="primary-button">필터 등록</button>
                </div>
            </form>
        </section>
    </main>
</div>

<script>
    const classFileInput = document.getElementById("classFile");
    const selectedFileName = document.getElementById("selectedFileName");

    classFileInput.addEventListener("change", () => {
        const selectedFile = classFileInput.files[0];
        selectedFileName.textContent = selectedFile
            ? selectedFile.name
            : "클릭하여 컴파일된 필터 클래스 파일을 선택하세요.";
    });
</script>
</body>
</html>
