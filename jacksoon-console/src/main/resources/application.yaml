server:
  port: 1014
spring:
  application:
    name: jacksoon-console
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:jacksoon_console}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
filter:
  server:
    url: http://filter-management:1011/filter
metric:
  directory: /app/metric

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true